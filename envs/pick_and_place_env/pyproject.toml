[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-pick_and_place_env"
version = "0.1.0"
description = "Pick And Place Env environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.1",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "numpy>=1.26.0",
    "mujoco>=3.0.0",
    "gymnasium>=1.0.0",
    "gymnasium-robotics>=1.3.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m pick_and_place_env.server.app
server = "pick_and_place_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["pick_and_place_env", "pick_and_place_env.server"]
package-dir = { "pick_and_place_env" = ".", "pick_and_place_env.server" = "server" }
